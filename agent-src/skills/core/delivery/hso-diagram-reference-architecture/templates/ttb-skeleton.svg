<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 130 1920 1060" width="1920" height="1060"
     font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <!--
    Reference Architecture - TTB (top-to-bottom) skeleton.

    Layout zones:
      Audiences band       y=140-370   x=60-1845    7 cards x 240w x 145h
      Middle 3-column band y=400-1080
        AWS column         x=40   w=340            (4 cards stacked, h=110)
        Platform column    x=500  w=920            (4 internal rows)
        External column    x=1540 w=300            (4 cards stacked, h=140)
      Channels             120 px wide, between AWS<->Platform and Platform<->External
      Legend band          y=1100-1190

    Author: <author>. Rev <yyyy-mm-dd>. Engagement: <engagement>.
  -->

  <!-- COPY FROM defs-block.svg (paste the full <defs>...</defs> block here) -->

  <!-- Canvas background -->
  <rect x="0" y="130" width="1920" height="950" fill="#FDFCF7"/>
  <rect x="0" y="1080" width="1920" height="110" fill="#FDFCF7"/>

  <!-- Zone labels -->
  <text x="60"   y="155" class="zone-lbl" fill="#00395F">Audiences</text>
  <text x="60"   y="395" class="zone-lbl">AWS data estate</text>
  <text x="500"  y="395" class="zone-lbl" fill="#00395F">Microsoft cloud &#8212; the platform</text>
  <text x="1540" y="395" class="zone-lbl">Integrations &amp; external systems</text>

  <!-- ============================================================
       AUDIENCES BAND HERE  (y=140-370)
       7 cards: x = 60, 315, 570, ...
       Card width 240, height 145, intra-group gap 15, inter-group gap 30
       Use class="persona-n" for name, class="persona-r" for description
       ============================================================ -->

  <!-- ============================================================
       AWS COLUMN HERE  (x=40, w=340, y=400-1080)
       Outer zone: rx=20, fill="#FFF8E1", stroke 2px, filter zoneShadow
       Top ribbon 46 px tall, ribbon-amber text
       4 inner cards stacked, h=110 each, gap ~55 px

       Vendor icon usage examples:
         <!-- AWS column ribbon (small mark next to ribbon text) -->
         <!-- Example: <use href="#icAWS" x="56" y="412" width="30" height="28"/> -->
         <!-- Power BI card (top of AWS column - data viz consumer) -->
         <!-- Example: <use href="#icPowerBI" x="80" y="478" width="50" height="50"/> -->
       ============================================================ -->

  <!-- ============================================================
       PLATFORM COLUMN HERE  (x=500, w=920, y=400-1080)
       Outer zone: rx=20, fill="#F7FAFC", stroke 2px, filter zoneShadow
       Top ribbon 50 px tall, fill #00395F, ribbon-t text
       4 internal rows: 2 cards / 1 card / 3 cards / Azure sub-zone (3 cards)
       Azure sub-zone ribbon: 42 px tall, ribbon-t text, fill #0062AD

       Vendor icon usage examples (place ON the card next to its header):
         <!-- D365 row (FS card) -->
         <!-- Example: <use href="#icD365FS" x="540" y="475" width="80" height="80"/> -->
         <!-- Customer Portal card -->
         <!-- Example: <use href="#icPowerPages" x="990" y="475" width="80" height="80"/> -->
         <!-- Dataverse row -->
         <!-- Example: <use href="#icDataverse" x="540" y="630" width="80" height="80"/> -->
         <!-- Power Automate row -->
         <!-- Example: <use href="#icPowerAutomate" x="540" y="785" width="60" height="60"/> -->
         <!-- Copilot card -->
         <!-- Example: <use href="#icCopilot" x="760" y="785" width="60" height="60"/> -->
         <!-- Power Apps card -->
         <!-- Example: <use href="#icPowerApps" x="980" y="785" width="60" height="60"/> -->
         <!-- Azure sub-zone ribbon -->
         <!-- Example: <use href="#icAzure" x="532" y="902" width="30" height="28"/> -->
       ============================================================ -->

  <!-- ============================================================
       EXTERNAL COLUMN HERE  (x=1540, w=300, y=400-1080)
       4 cards stacked, h=140 each

       Vendor icon usage examples:
         <!-- QuickBooks Online card -->
         <!-- Example: <use href="#icQuickBooks" x="1556" y="430" width="50" height="50"/> -->
       ============================================================ -->

  <!-- ============================================================
       ARROWS HERE
       All arrows: stroke-width 2.5, right-angle paths only.
       Persona -> platform top: targets evenly distributed across the
       platform zone top edge (e.g., 7 audiences -> x = 540, 615, 690,
       945, 1215, 1290, 1370).
       Platform <-> AWS: through left channel (x ~380-500).
       Platform <-> External: through right channel (x ~1420-1540).
       Use markers arrBlue / arrCoral / arrAmber / arrPurple / arrGreen / arrSteel.
       ============================================================ -->

  <!-- ============================================================
       LEGEND HERE  (y=1100-1190)
       Horizontal divider at y=1100.
       Color swatches + class="legend-t" labels.
       Stamp at bottom-right: class="stamp" "Rev <yyyy-mm-dd> | <author> | TTB"
       ============================================================ -->

</svg>
