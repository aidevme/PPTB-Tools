<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 130 1920 950" width="1920" height="950"
     font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <!--
    Reference Architecture - LTR (left-to-right) skeleton.

    Layout zones:
      Personas column  x=40  w=340     (audiences grouped vertically)
      Platform column  x=440 w=780     (Microsoft cloud, ribbon top)
      External column  x=1300 w=580    (integrations, data estate)
      Legend band      y=970-1080

    Author: <author>. Rev <yyyy-mm-dd>. Engagement: <engagement>.
  -->

  <!-- COPY FROM defs-block.svg (paste the full <defs>...</defs> block here) -->

  <!-- Canvas background -->
  <rect x="0" y="130" width="1920" height="950" fill="#FDFCF7"/>

  <!-- Zone labels -->
  <text x="40"   y="155" class="zone-lbl" fill="#00395F">Personas</text>
  <text x="460"  y="145" class="zone-lbl">Microsoft cloud &#8212; the platform</text>
  <text x="1320" y="145" class="zone-lbl">Integrations &amp; external systems</text>

  <!-- ============================================================
       PERSONAS COLUMN HERE  (x=40, w=340, y=160-1000)
       Group personas under sub-headings (zone-lbl, fill="#00395F").
       Audience card: x=40 w=340 h=110 typical; emphasized = 3px coral border.
       8 px coloured top stripe optional (matches persona group color).
       ============================================================ -->

  <!-- ============================================================
       PLATFORM COLUMN HERE  (x=440, w=780, y=160-1000)
       Outer zone: rx=20, fill="#F7FAFC", stroke 2px, filter zoneShadow
       Top ribbon 50 px tall, fill #00395F, ribbon-t text
       Internal cards arranged in 2-3 rows; Azure sub-zone at bottom.

       Vendor icon usage examples (place ON the card next to its header):
         <!-- D365 FS card -->
         <!-- Example: <use href="#icD365FS" x="460" y="240" width="60" height="60"/> -->
         <!-- Customer Portal (Power Pages) card -->
         <!-- Example: <use href="#icPowerPages" x="900" y="240" width="60" height="60"/> -->
         <!-- Dataverse card -->
         <!-- Example: <use href="#icDataverse" x="460" y="380" width="60" height="60"/> -->
         <!-- Power Automate card -->
         <!-- Example: <use href="#icPowerAutomate" x="460" y="500" width="50" height="50"/> -->
         <!-- Copilot card -->
         <!-- Example: <use href="#icCopilot" x="680" y="500" width="50" height="50"/> -->
         <!-- Power Apps card -->
         <!-- Example: <use href="#icPowerApps" x="900" y="500" width="50" height="50"/> -->
         <!-- Azure sub-zone ribbon -->
         <!-- Example: <use href="#icAzure" x="460" y="822" width="28" height="28"/> -->
       ============================================================ -->

  <!-- ============================================================
       EXTERNAL COLUMN HERE  (x=1300, w=580, y=160-1000)
       Cards grouped by category (Data estate / Payments / ERP / Telephony).
       Use card-h-s for headers when stacking multiple in a category.

       Vendor icon usage examples:
         <!-- AWS category ribbon -->
         <!-- Example: <use href="#icAWS" x="1316" y="172" width="30" height="28"/> -->
         <!-- Power BI card (data estate) -->
         <!-- Example: <use href="#icPowerBI" x="1316" y="240" width="50" height="50"/> -->
         <!-- QuickBooks Online card (ERP) -->
         <!-- Example: <use href="#icQuickBooks" x="1316" y="620" width="50" height="50"/> -->
       ============================================================ -->

  <!-- ============================================================
       ARROWS HERE
       Personas -> platform: enter on platform left edge.
       Platform <-> External: cross right channel (x ~1220-1300).
       Distribute entries evenly across target edges (avoid bunching).
       ============================================================ -->

  <!-- ============================================================
       LEGEND HERE  (y=970-1080)
       Stamp at bottom-right: class="stamp" "Rev <yyyy-mm-dd> | <author> | LTR"
       ============================================================ -->

</svg>
