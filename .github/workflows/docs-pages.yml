name: Docs site (GitHub Pages)

# Builds the VitePress site in docs/ and publishes it to GitHub Pages at https://aidevme.github.io/PPTB-Tools/.
# Pages must use "GitHub Actions" as its source (Settings → Pages → Build and deployment).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Only the deploy job needs to write to Pages; GITHUB_TOKEN gets nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer run waits instead of cancelling one that's already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history, so VitePress can show each page's last-updated date if that's turned on.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build the docs site
        run: npm run docs:build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
