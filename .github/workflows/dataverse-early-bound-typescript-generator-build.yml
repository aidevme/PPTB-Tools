name: Dataverse Early-Bound TypeScript Generator

on:
  push:
    branches: [main]
    paths:
      - "tools/dataverse-early-bound-typescript-generator/**"
      - ".github/workflows/dataverse-early-bound-typescript-generator-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/dataverse-early-bound-typescript-generator/**"
      - ".github/workflows/dataverse-early-bound-typescript-generator-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/dataverse-early-bound-typescript-generator

jobs:
  # One job, so dependencies are installed once. The steps run in order and the job stops at the first failure:
  # the manifest check first (cheapest, needs no build output), then the tests, then the build and its artifact.
  build:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/dataverse-early-bound-typescript-generator/package-lock.json

      # pptb-validate comes from the @pptb/types dev dependency.
      - name: Install dependencies
        run: npm ci

      # Checks package.json against PPTB's tool requirements (required fields, icon path, reachable repository and
      # readme URLs).
      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      # `npm run build` runs `tsc` (typecheck) before `vite build`.
      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: dataverse-early-bound-typescript-generator-dist
          path: tools/dataverse-early-bound-typescript-generator/dist
          if-no-files-found: error
          retention-days: 14
