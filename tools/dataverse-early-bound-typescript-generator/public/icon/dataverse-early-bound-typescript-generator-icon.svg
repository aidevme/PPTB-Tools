<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- A Dataverse table store (cylinder) with a TypeScript "TS" badge: tables in, typed code out.
       Single colour only: PPTB draws tool icons as a CSS mask in the theme's text colour. -->
  <defs>
    <!-- Cuts a gap around the badge out of the cylinder. -->
    <mask id="badge-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="8.6" y="8.6" width="15.4" height="15.4" rx="3.6" fill="#000"/>
    </mask>
    <!-- Knocks the letters out of the badge. -->
    <mask id="badge-letters" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.2 14.1h4.2M14.3 14.1v6.3"/>
        <path d="M21.1 14.7c-.4-.6-1-.9-1.8-.9-1 0-1.7.6-1.7 1.4 0 2 3.6 1.4 3.6 3.5 0 1-.8 1.7-1.9 1.7-.8 0-1.5-.4-1.9-1"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#badge-gap)" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <ellipse cx="7" cy="4.4" rx="5.4" ry="2.3"/>
    <path d="M1.6 4.4v11.2c0 1.3 2.4 2.3 5.4 2.3s5.4-1 5.4-2.3V4.4"/>
    <path d="M1.6 10c0 1.3 2.4 2.3 5.4 2.3s5.4-1 5.4-2.3"/>
  </g>
  <rect x="10" y="10" width="13" height="13" rx="2.6" fill="#000" mask="url(#badge-letters)"/>
</svg>
